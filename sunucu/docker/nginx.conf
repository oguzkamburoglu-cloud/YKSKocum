# AI Koçum — container ici nginx
# Statik site + /api/* -> php-fpm. Sunucu dosyalari (sunucu/, .env, .sql)
# disariya KAPALI; API'ye yalnizca /api/ yolu uzerinden ulasilir.
server {
    listen 80;
    server_name _;
    root /var/www/html;
    index index.html;
    client_max_body_size 2m;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # --- gizli / sunucu-tarafi dosyalar disariya kapali ---
    location ~ /\.(env|git|ht) { return 404; }
    location ~* \.(sql|sh|md|ya?ml|lock)$ { return 404; }
    location ~ ^/sunucu/ { return 404; }      # kontrol.php, push.php, api kaynagi vb.
    location ~ ^/test/  { return 404; }
    location ~ \.php$   { return 404; }       # PHP yalnizca /api/ uzerinden

    # --- API: tek giris noktasi ---
    location /api/ {
        fastcgi_pass php:9000;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/html/sunucu/api/index.php;
        fastcgi_param SCRIPT_NAME     /sunucu/api/index.php;
        fastcgi_param REQUEST_URI     $request_uri;
        fastcgi_read_timeout 30s;
    }

    # --- statik uygulama ---
    # Servis calisani kod icin "once ag" stratejisi kullanir; HTML/JS/SW
    # tarayici onbelleginde takilmasin diye kisa omur verilir.
    location ~* \.(html|js|json)$ { add_header Cache-Control "no-cache" always; try_files $uri =404; }
    location ~* \.(css|png|svg|ico|woff2?)$ { add_header Cache-Control "public, max-age=604800" always; try_files $uri =404; }
    location / { try_files $uri $uri/ =404; }
}
